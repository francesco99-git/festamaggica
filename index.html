<style>
/* =====================================================================
   SCENOGRAFIE
   Cinque temi, un file. Ogni tema è un insieme di variabili CSS più due
   livelli decorativi (#scena-a e #scena-b) che cambiano aspetto in base
   all'attributo data-tema sul <body>.

   Perché non cinque file HTML: la logica di voto è identica in tutti e
   cinque. Duplicarla significherebbe correggere ogni futuro bug cinque
   volte, e dimenticarsene in almeno due. Qui cambia solo la pelle.

   Tutto è generato in CSS, niente immagini: il file resta autonomo e
   leggero da scaricare in 4G, e un fondo generato si adatta a qualsiasi
   schermo mentre una foto si taglia male fra un iPhone SE e un Android
   largo.
   ===================================================================== */

/* ---------- token comuni a tutti i temi ---------- */
:root{
  --ok:#5BC8A4;
  /* Quanto il contenuto si tiene lontano dai bordi. È una variabile
     perché i temi con decorazioni laterali (sipario, pellicola) devono
     poterla aumentare: una tenda che copre un'etichetta è un bug, non
     una scelta estetica. */
  --pad:clamp(16px,5vw,22px);
  --raggio:14px;
  --max:560px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px)}

body{
  margin:0;
  color:var(--paper);
  font-family:Karla,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  background:var(--fondo);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}

/* I due livelli di scenografia stanno sotto al contenuto e non
   intercettano i tap: position:fixed così restano fermi mentre la
   pagina scorre, come un fondale teatrale dietro agli attori. */
#scena-a,#scena-b{
  position:fixed; inset:0; z-index:0; pointer-events:none;
}
.wrap,.barra{position:relative; z-index:1}

/* =====================================================================
   TEMA 1 — SIPARIO
   Velluto rosso ai lati, riflettore dall'alto, oro.
   I drappeggi sono un repeating-linear-gradient: le pieghe di una
   tenda sono letteralmente bande chiare e scure che si ripetono.
   ===================================================================== */
body[data-tema="sipario"]{
  --fondo:radial-gradient(ellipse 120% 70% at 50% -10%, #5E1A1A 0%, #2A0A0E 45%, #140508 100%) fixed;
  --surface:rgba(46,14,20,.82);
  --raised:rgba(86,26,34,.72);
  --line:#6E2630;
  --paper:#F6EBE4;
  --muted:#C2A08F;
  --oro:#E7B64F;
  --scelto:#E7B64F;
  --su-scelto:#2A0A0E;
  --bar:rgba(20,5,8,.92);
  --titolo:#F2D9A0;
  --pad:clamp(40px,12vw,80px);
}
body[data-tema="sipario"] #scena-a::before,
body[data-tema="sipario"] #scena-a::after{
  content:""; position:absolute; top:0; bottom:0; width:clamp(26px,8.5vw,78px);
  background:
    linear-gradient(180deg, rgba(0,0,0,.5), transparent 18%, transparent 72%, rgba(0,0,0,.65)),
    repeating-linear-gradient(90deg,
      #3E0A12 0px, #9A1F2C 9px, #BC2836 14px, #6A1420 22px, #3A0910 30px);
}
body[data-tema="sipario"] #scena-a::before{left:0}
body[data-tema="sipario"] #scena-a::after{right:0; transform:scaleX(-1)}
body[data-tema="sipario"] #scena-b::before{
  /* mantovana: la fascia superiore del sipario */
  content:""; position:absolute; left:0; right:0; top:0; height:46px;
  background:
    linear-gradient(180deg,#8B1C28,#5A1019 70%,rgba(90,16,25,0)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 8px, transparent 8px 20px);
}
body[data-tema="sipario"] #scena-b::after{
  /* Fascio del riflettore + vignettatura che stacca il contenuto dalle
     tende. Un solo elemento con due gradienti sovrapposti: il primo
     illumina dall'alto, il secondo scurisce i bordi. Prima il fascio
     aveva un'altezza fissa e si vedeva dove finiva, come il bordo di un
     pannello: ora copre tutto il riquadro e sfuma davvero. */
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(ellipse 58% 42% at 50% 0%, rgba(255,216,146,.20), transparent 68%),
    radial-gradient(ellipse 78% 62% at 50% 46%, transparent 42%, rgba(12,3,6,.72) 100%);
}

/* =====================================================================
   TEMA 2 — DÉCO
   Nero e oro, raggiera geometrica, cornice a filo doppio.
   Il ventaglio art déco è un repeating-conic-gradient: spicchi alternati
   intorno a un punto. Una riga di CSS al posto di un SVG.
   ===================================================================== */
body[data-tema="deco"]{
  --fondo:linear-gradient(180deg,#0B0A0C 0%,#141015 60%,#0B0A0C 100%) fixed;
  --surface:rgba(23,19,24,.86);
  --raised:rgba(44,37,45,.8);
  --line:#55461F;
  --paper:#F4EEE3;
  --muted:#A2937B;
  --oro:#D9AE49;
  --scelto:#D9AE49;
  --su-scelto:#141015;
  --bar:rgba(11,10,12,.93);
  --titolo:#E8CB86;
}
body[data-tema="deco"] #scena-a::before{
  content:""; position:absolute; left:50%; top:-28vh;
  width:190vw; height:120vh; transform:translateX(-50%);
  background:repeating-conic-gradient(from 180deg at 50% 24%,
    rgba(217,174,73,.12) 0deg 3deg, transparent 3deg 9deg);
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 24%, #000 10%, transparent 72%);
          mask-image:radial-gradient(ellipse 60% 55% at 50% 24%, #000 10%, transparent 72%);
}
body[data-tema="deco"] #scena-b{
  border:1px solid rgba(217,174,73,.30);
  outline:1px solid rgba(217,174,73,.16);
  outline-offset:5px;
  margin:9px;
  inset:0;
}

/* =====================================================================
   TEMA 3 — TAPPETO ROSSO
   Passatoia in prospettiva alla base, flash dei fotografi.
   La prospettiva è un trapezio: un rettangolo ruotato su rotateX con
   transform-origin in basso. I flash sono radial-gradient sparsi.
   ===================================================================== */
body[data-tema="redcarpet"]{
  --fondo:linear-gradient(180deg,#0A0709 0%,#160A0C 70%,#200B0E 100%) fixed;
  --surface:rgba(30,16,19,.84);
  --raised:rgba(58,30,34,.75);
  --line:#5A2A30;
  --paper:#F7EFEA;
  --muted:#BE9C95;
  --oro:#E3B45A;
  --scelto:#C8303F;
  --su-scelto:#FFF4F2;
  --bar:rgba(10,7,9,.93);
  --titolo:#EFD7A8;
}
body[data-tema="redcarpet"] #scena-a::before{
  /* La passatoia stava sul bordo inferiore, dove la barra di invio la
     copre per intero: sul telefono non la vedeva nessuno. L'ho alzata e
     allargata, così entra nella prima schermata. */
  content:""; position:absolute; left:50%; bottom:6vh;
  width:96vw; height:62vh; transform:translateX(-50%) perspective(300px) rotateX(62deg);
  transform-origin:bottom center;
  background:linear-gradient(180deg,#6E111C,#B4202F 38%,#E0404E);
  box-shadow:0 0 120px 46px rgba(190,34,50,.42);
  opacity:.9;
}
body[data-tema="redcarpet"] #scena-a::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:66vh;
  background:radial-gradient(ellipse 72% 100% at 50% 118%,
    rgba(226,70,84,.34), transparent 70%);
}
body[data-tema="redcarpet"] #scena-b::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle 26px at 11% 16%, rgba(255,248,225,.16), transparent 70%),
    radial-gradient(circle 18px at 86% 11%, rgba(255,244,214,.14), transparent 70%),
    radial-gradient(circle 34px at 27% 39%, rgba(255,255,255,.08), transparent 70%),
    radial-gradient(circle 20px at 71% 28%, rgba(255,250,235,.12), transparent 70%),
    radial-gradient(circle 24px at 93% 52%, rgba(255,240,200,.10), transparent 70%),
    radial-gradient(circle 16px at 5%  58%, rgba(255,255,255,.10), transparent 70%);
}

/* =====================================================================
   TEMA 4 — NOTTE DORATA
   Nero assoluto e fasci di luce che convergono dal basso.
   È il taglio più vicino alle locandine delle premiazioni: niente
   oggetti, solo luce. Anche il più leggero da disegnare.
   ===================================================================== */
body[data-tema="notte"]{
  --fondo:#050405;
  --surface:rgba(20,17,14,.84);
  --raised:rgba(44,36,26,.78);
  --line:#4A3C22;
  --paper:#F6F1E6;
  --muted:#9C8F77;
  --oro:#E9B54A;
  --scelto:#E9B54A;
  --su-scelto:#191307;
  --bar:rgba(5,4,5,.93);
  --titolo:#F0CE85;
}
/* bagliore alto: senza, la prima schermata resta nera e spenta,
   perché i raggi stanno in fondo e il contenuto li copre */
body[data-tema="notte"] #scena-a::after{
  content:""; position:absolute; left:50%; top:-26vh; transform:translateX(-50%);
  width:150vw; height:72vh;
  background:radial-gradient(ellipse 46% 100% at 50% 0%,
    rgba(255,206,122,.22), rgba(233,181,74,.06) 48%, transparent 74%);
}
body[data-tema="notte"] #scena-a::before{
  content:""; position:absolute; left:50%; bottom:-12vh;
  width:220vw; height:90vh; transform:translateX(-50%) rotate(-7deg);
  background:repeating-linear-gradient(74deg,
    rgba(233,181,74,.00) 0px, rgba(233,181,74,.00) 22px,
    rgba(233,181,74,.42) 27px, rgba(255,220,150,.10) 42px);
  filter:blur(1.2px);
  -webkit-mask-image:radial-gradient(ellipse 65% 85% at 50% 100%, #000 0%, transparent 72%);
          mask-image:radial-gradient(ellipse 65% 85% at 50% 100%, #000 0%, transparent 72%);
}
body[data-tema="notte"] #scena-b::before{
  content:""; position:absolute; left:0; right:0; bottom:0; height:60vh;
  background:radial-gradient(ellipse 60% 100% at 50% 108%,
    rgba(255,205,120,.35), rgba(233,181,74,.08) 45%, transparent 72%);
}

/* =====================================================================
   TEMA 5 — PELLICOLA
   Bordi a perforazioni 35mm, grafite e oro freddo.
   Le perforazioni sono un repeating-linear-gradient mascherato: niente
   immagini, e restano nitide a qualsiasi densità di pixel.
   ===================================================================== */
body[data-tema="pellicola"]{
  --fondo:linear-gradient(180deg,#0C0C0E,#15151A 55%,#0C0C0E) fixed;
  --surface:rgba(26,26,31,.88);
  --raised:rgba(48,48,56,.82);
  --line:#3C3C46;
  --paper:#F0F0F3;
  --muted:#9A9AA6;
  --oro:#D8C27E;
  --scelto:#D8C27E;
  --su-scelto:#15151A;
  --bar:rgba(12,12,14,.94);
  --titolo:#E6DCB4;
  --pad:clamp(36px,11vw,64px);
}
body[data-tema="pellicola"] #scena-a::before,
body[data-tema="pellicola"] #scena-a::after{
  content:""; position:absolute; top:0; bottom:0; width:clamp(22px,7vw,46px);
  background:#17171C;
  border-right:1px solid #2A2A33; border-left:1px solid #2A2A33;
}
body[data-tema="pellicola"] #scena-a::before{left:0}
body[data-tema="pellicola"] #scena-a::after{right:0}
body[data-tema="pellicola"] #scena-b::before,
body[data-tema="pellicola"] #scena-b::after{
  content:""; position:absolute; top:0; bottom:0; width:clamp(10px,3.2vw,20px);
  background:repeating-linear-gradient(180deg,
    transparent 0 10px, rgba(236,236,246,.42) 10px 25px, transparent 25px 35px);
  -webkit-mask-image:repeating-linear-gradient(180deg,
    #000 0 35px);
  border-radius:4px;
}
body[data-tema="pellicola"] #scena-b::before{left:clamp(6px,2vw,13px)}
body[data-tema="pellicola"] #scena-b::after{right:clamp(6px,2vw,13px)}

/* =====================================================================
   COMPONENTI — identici in tutti i temi, parlano solo per variabili
   ===================================================================== */
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--pad)}

header{padding:clamp(40px,11vh,78px) 0 26px; text-align:center}

.crest{width:58px; height:58px; margin:0 auto 20px; display:block}
.crest path,.crest circle,.crest line{stroke:var(--oro)}

h1{
  font-family:Cinzel,"Bodoni Moda",serif; font-weight:600;
  font-size:clamp(28px,8.6vw,46px); line-height:1.08; margin:0 0 14px;
  letter-spacing:.06em; color:var(--titolo);
  text-shadow:0 2px 26px rgba(233,181,74,.22);
}
.filetto{
  width:min(260px,62%); height:1px; margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--oro),transparent);
}
.sub{color:var(--muted); margin:0; font-size:14.5px; letter-spacing:.02em}
.sub:empty{display:none}

.votante{margin:26px 0 6px}
label{
  display:block; font-size:11px; color:var(--muted);
  margin-bottom:9px; letter-spacing:.18em; text-transform:uppercase;
}
select{
  width:100%; padding:14px 16px; border-radius:var(--raggio);
  background:var(--surface); border:1px solid var(--line);
  color:var(--paper); font:inherit;
  -webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23bbb' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 16px center; background-size:12px;
  padding-right:42px;
}
select option{background:#1A1218; color:#F2EDE6}
.filtro{
  width:100%; padding:10px 14px; border-radius:10px; margin-bottom:13px;
  background:rgba(0,0,0,.28); border:1px solid var(--line);
  color:var(--paper); font:inherit; font-size:14px;
}
select:focus-visible,.filtro:focus-visible,.chip:focus-visible,button:focus-visible{
  outline:2px solid var(--oro); outline-offset:2px;
}

.cat{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--raggio); padding:20px 17px; margin:15px 0;
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
}
.cat h2{
  font-family:Cinzel,serif; font-weight:600; font-size:19px;
  margin:0; line-height:1.25; letter-spacing:.04em; color:var(--titolo);
}
.cat .aiuto{color:var(--muted); font-size:15px; margin:7px 0 0; line-height:1.45}
.stato{font-size:12px; color:var(--muted); margin:11px 0 14px;
       display:flex; align-items:center; gap:7px; letter-spacing:.04em}
.stato.pieno{color:var(--ok)}
.stato .pallino{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  position:relative; font:inherit; font-size:14.5px;
  padding:9px 14px; border-radius:999px; cursor:pointer;
  background:var(--raised); color:var(--paper);
  border:1px solid transparent;
  transition:background .14s ease, color .14s ease;
}
.chip[aria-pressed="true"]{
  background:var(--scelto); color:var(--su-scelto); font-weight:700;
  box-shadow:0 0 0 1px var(--scelto), 0 4px 18px -6px var(--scelto);
}
.chip .rank{display:none}
.chip[aria-pressed="true"] .rank{
  display:inline-grid; place-items:center; width:17px; height:17px;
  border-radius:50%; background:var(--su-scelto); color:var(--scelto);
  font-size:11px; font-weight:700; margin-right:7px; vertical-align:1px;
}
.chip.nascosto,.chip.escluso{display:none}

.barra{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  background:var(--bar);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));
}
.barra-in{max-width:var(--max); margin:0 auto; display:flex; align-items:center; gap:14px}
.avanz{font-size:11px; color:var(--muted); flex:none; min-width:68px;
       letter-spacing:.12em; text-transform:uppercase}
.avanz b{display:block; color:var(--paper); font-size:16px; letter-spacing:0}
button.invia{
  flex:1; padding:15px; border:0; border-radius:var(--raggio);
  background:linear-gradient(180deg,var(--oro),color-mix(in srgb,var(--oro) 78%, #000));
  color:#1A1206; font:inherit; font-weight:700; font-size:15.5px;
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
}
button.invia:disabled{background:var(--raised); color:var(--muted); cursor:not-allowed}

.esito{margin:18px 0 0; padding:13px 15px; border-radius:var(--raggio);
       font-size:14px; border:1px solid var(--line); background:var(--surface)}
.esito.ok{border-color:var(--ok); color:var(--ok)}
.esito.ko{border-color:#E06A72; color:#F0969C}
.esito[hidden]{display:none}

.avviso{font-size:12px; color:var(--muted); text-align:center;
        border-top:1px solid var(--line); padding:18px 0 34px; margin-top:26px}

/* selettore dei temi: compare solo con ?demo=1, i votanti non lo vedono */
#temi{
  position:fixed; z-index:20; left:50%; transform:translateX(-50%);
  top:calc(8px + env(safe-area-inset-top,0px));
  display:flex; gap:5px; padding:5px; border-radius:999px;
  background:rgba(0,0,0,.7); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
#temi button{
  font:inherit; font-size:11px; padding:6px 10px; border-radius:999px;
  border:0; background:transparent; color:var(--muted); cursor:pointer;
}
#temi button[aria-current="true"]{background:var(--oro); color:#15100A; font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="scena-a" aria-hidden="true"></div>
<div id="scena-b" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <svg class="crest" viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <circle cx="30" cy="30" r="27" stroke-width="1"/>
      <circle cx="30" cy="30" r="21" stroke-width="0.6" opacity=".55"/>
      <path d="M30 13 L33.6 25.4 L46 25.4 L36.1 33 L39.8 45.4 L30 37.7 L20.2 45.4 L23.9 33 L14 25.4 L26.4 25.4 Z"
            stroke-width="1.1" stroke-linejoin="round"/>
      <line x1="30" y1="3" x2="30" y2="9" stroke-width="1"/>
      <line x1="30" y1="51" x2="30" y2="57" stroke-width="1"/>
      <line x1="3" y1="30" x2="9" y2="30" stroke-width="1"/>
      <line x1="51" y1="30" x2="57" y2="30" stroke-width="1"/>
    </svg>
    <h1 id="titolo"></h1>
    <div class="filetto"></div>
    <p class="sub" id="sottotitolo"></p>
  </header>

  <div class="votante">
    <label for="nome">Chi sei</label>
    <select id="nome">
      <option value="">— seleziona il tuo nome —</option>
    </select>
  </div>

  <main id="schede"></main>

  <p class="esito" id="esito" hidden></p>

  <p class="avviso">Il voto è anonimo per gli altri invitati: nessuno vede cosa hai scelto.</p>
</div>

<div class="barra">
  <div class="barra-in">
    <div class="avanz"><b id="conta">0/0</b>premi</div>
    <button class="invia" id="invia" disabled>Invia il voto</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     STATO
     voti = { idCategoria: [indiceNome, ...] }
     Conservo gli INDICI, non i nomi: l'indice è l'unità di codifica
     e l'ordine dell'array è già il ranking del podio. Nessuna struttura
     parallela da tenere sincronizzata.
  --------------------------------------------------------------- */
  const voti = {};
  CONFIG.categorie.forEach(c => voti[c.id] = []);

  // Indice del votante nell'array partecipanti, -1 = non ancora selezionato.
  // Tenerlo come INDICE e non come stringa è ciò che permette allo spoglio
  // di sapere con certezza chi ha votato e, per differenza, chi manca:
  // con il nome digitato a mano "Fra", "Francesco" e "franci" sarebbero
  // tre persone diverse e l'elenco degli assenti non avrebbe senso.
  let votanteIdx = -1;

  // Le opzioni del CONFIG si normalizzano UNA volta qui, non a ogni uso.
  // "=== true" e non "!!": una chiave assente, una stringa "false" o un
  // valore sbagliato diventano tutti false, invece di propagare undefined
  // nel resto del codice. Un valore non validato è un bug che aspetta.
  const VIETA_AUTOVOTO = CONFIG.vietaAutovoto === true;

  /* -------------------------------------------------------------
     TEMA
     Risoluzione a cascata: ?tema=... nell'URL batte CONFIG.tema,
     che batte il primo tema disponibile. Il parametro nell'URL
     serve a te: pubblichi UNA volta e guardi tutte le varianti dal
     telefono cambiando la query string, senza ricaricare il file
     su GitHub cinque volte e senza aspettare la cache della CDN.
     I votanti ricevono il link pulito e vedono il tema di default.
  ------------------------------------------------------------- */
  const TEMI = ["sipario", "deco", "redcarpet", "notte", "pellicola"];
  const ETICHETTE = { sipario:"Sipario", deco:"Déco", redcarpet:"Red carpet",
                      notte:"Notte", pellicola:"Pellicola" };

  const q = new URLSearchParams(location.search);
  function applicaTema(nome){
    document.body.dataset.tema = TEMI.includes(nome) ? nome : TEMI[0];
  }
  applicaTema(q.get("tema") || CONFIG.tema);

  // Selettore visibile solo con ?demo=1: un votante che lo trovasse
  // cambierebbe aspetto alla scheda e penserebbe di aver rotto qualcosa.
  if (q.get("demo") === "1") {
    const barra = document.createElement("div");
    barra.id = "temi";
    TEMI.forEach(nome => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = ETICHETTE[nome];
      b.setAttribute("aria-current", String(document.body.dataset.tema === nome));
      b.addEventListener("click", () => {
        applicaTema(nome);
        [...barra.children].forEach(x =>
          x.setAttribute("aria-current", String(x.textContent === ETICHETTE[nome])));
        // aggiorno l'URL senza ricaricare: così puoi copiare il link
        // del tema che ti piace e incollarlo nel CONFIG.
        history.replaceState(null, "", "?tema=" + nome + "&demo=1");
      });
      barra.appendChild(b);
    });
    document.body.appendChild(barra);
  }

  const $ = s => document.querySelector(s);
  document.getElementById("titolo").textContent = CONFIG.titolo;
  document.getElementById("sottotitolo").textContent = CONFIG.sottotitolo;
  document.title = CONFIG.titolo;

  /* ---------------------------------------------------------------
     COSTRUZIONE DOM
     Genero tutto da CONFIG: aggiungere una categoria o un nome non
     richiede di toccare l'HTML. Uso <button aria-pressed> invece di
     <select> perché su mobile un tap batte due tap + scroll ruota,
     e perché il podio ha bisogno di mostrare l'ordine 1-2-3.
  --------------------------------------------------------------- */
  const schede = document.getElementById("schede");

  CONFIG.categorie.forEach(cat => {
    const sez = document.createElement("section");
    sez.className = "cat";

    const h = document.createElement("h2");
    h.textContent = cat.nome;
    sez.appendChild(h);

    if (cat.aiuto) {
      const p = document.createElement("p");
      p.className = "aiuto";
      p.textContent = cat.aiuto;
      sez.appendChild(p);
    }

    const stato = document.createElement("p");
    stato.className = "stato";
    stato.innerHTML = '<span class="pallino"></span><span></span>';
    sez.appendChild(stato);

    // Filtro di ricerca: compare solo se la lista è lunga abbastanza
    // da rendere lo scorrimento fastidioso. Sotto i 14 nomi è rumore.
    if (CONFIG.partecipanti.length > 14) {
      const f = document.createElement("input");
      f.type = "text"; f.className = "filtro"; f.placeholder = "Cerca un nome";
      f.autocomplete = "off";
      f.addEventListener("input", () => {
        const q = f.value.trim().toLowerCase();
        chips.forEach(ch => {
          // un nome selezionato resta sempre visibile: altrimenti
          // l'utente non può deselezionarlo mentre filtra
          const sel = ch.getAttribute("aria-pressed") === "true";
          // Boolean() esplicito: toggle con un secondo argomento non
          // booleano è la trappola che ha rotto i chip del podio.
          ch.classList.toggle("nascosto",
            Boolean(!sel && q !== "" && !ch.dataset.nome.toLowerCase().includes(q)));
        });
      });
      sez.appendChild(f);
    }

    const cont = document.createElement("div");
    cont.className = "chips";
    const chips = CONFIG.partecipanti.map((nome, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.dataset.nome = nome;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="rank"></span>';
      b.append(nome);
      b.addEventListener("click", () => tap(cat, i));
      cont.appendChild(b);
      return b;
    });
    sez.appendChild(cont);
    schede.appendChild(sez);

    // Chiusura: ogni categoria si ridisegna da sola leggendo voti[cat.id]
    cat._render = function(){
      const scelte = voti[cat.id];
      chips.forEach((ch, i) => {
        const pos = scelte.indexOf(i);
        ch.setAttribute("aria-pressed", pos >= 0 ? "true" : "false");
        ch.querySelector(".rank").textContent = (cat.picks > 1 && pos >= 0) ? (pos + 1) : "";
        // Classe separata da "nascosto": quella la gestisce il filtro di
        // ricerca, e due funzioni che si contendono la stessa classe si
        // sovrascrivono a vicenda. Un motivo, una classe.
        ch.classList.toggle("escluso", VIETA_AUTOVOTO && i === votanteIdx);
      });
      const done = scelte.length === cat.picks;
      stato.classList.toggle("pieno", done);
      stato.lastElementChild.textContent = done
        ? (cat.picks > 1 ? "Podio completo" : "Scelto: " + CONFIG.partecipanti[scelte[0]])
        : (cat.picks > 1
            ? "Mancano " + (cat.picks - scelte.length) + " scelte su " + cat.picks
            : "Nessuna scelta");
    };
  });

  /* ---------------------------------------------------------------
     LOGICA DI SELEZIONE
     Un solo comportamento per entrambi i casi (picks=1 e picks=3):
       - già selezionato  -> lo tolgo (e il podio si ricompatta da solo)
       - lista piena      -> tolgo il più vecchio (FIFO) e aggiungo
       - altrimenti       -> aggiungo in coda
     Con picks=1 la regola FIFO degenera nel classico radio button.
     Un solo ramo di codice = un solo posto dove sbagliare.
  --------------------------------------------------------------- */
  function tap(cat, i){
    const s = voti[cat.id];
    const pos = s.indexOf(i);
    if (pos >= 0)            s.splice(pos, 1);
    else {
      if (s.length >= cat.picks) s.shift();
      s.push(i);
    }
    cat._render();
    aggiornaBarra();
  }

  const btnInvia = document.getElementById("invia");
  const selNome = document.getElementById("nome");

  // Il menu si popola dalla stessa identica lista usata per i voti: nessun
  // elenco parallelo, quindi l'indice del votante e l'indice del votato
  // vivono nello stesso spazio di numerazione.
  CONFIG.partecipanti.forEach((nome, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = nome;
    selNome.appendChild(o);
  });

  selNome.addEventListener("change", () => {
    votanteIdx = selNome.value === "" ? -1 : parseInt(selNome.value, 10);
    try { localStorage.setItem("votante_idx", String(votanteIdx)); } catch(e){}

    // Se l'autovoto è vietato e la persona cambia identità DOPO aver già
    // votato, una scelta fatta prima può essere diventata un autovoto:
    // va tolta, altrimenti resterebbe selezionata ma invisibile e la
    // categoria risulterebbe completa senza che si veda perché.
    if (VIETA_AUTOVOTO && votanteIdx >= 0) {
      CONFIG.categorie.forEach(c => {
        const k = voti[c.id].indexOf(votanteIdx);
        if (k >= 0) voti[c.id].splice(k, 1);
      });
    }
    CONFIG.categorie.forEach(c => c._render());
    aggiornaBarra();
  });

  function complete(){
    return CONFIG.categorie.filter(c => voti[c.id].length === c.picks).length;
  }
  function aggiornaBarra(){
    const n = complete();
    document.getElementById("conta").textContent = n + "/" + CONFIG.categorie.length;
    btnInvia.disabled = !(n === CONFIG.categorie.length && votanteIdx >= 0);
    // Se il votante tocca qualcosa dopo un invio riuscito, l'esito mostrato
    // non descrive più lo stato corrente della scheda: va rimosso, altrimenti
    // resta a schermo un "Voto registrato" che si riferisce a scelte diverse.
    if (btnInvia.textContent !== "Invio in corso") {
      btnInvia.textContent = "Invia il voto";
      esito.hidden = true;
    }
  }

  /* ---------------------------------------------------------------
     CODIFICA DEL VOTO
       VOTO<versione>|<votante>|<cat0>|<cat1>|...
     dove <votante> e <catN> sono indici base36 dell'array partecipanti;
     i <catN> sono separati da "-" nell'ordine di scelta.
     Base36 tiene ogni indice a 1 carattere fino a 36 nomi.

       VOTO2|a|6-9-f|3|1|c|0|h

     Perché indici e non nomi per esteso:
       - il messaggio resta corto e incollabile senza a capo strani
       - due omonimi non collassano (indici diversi, nomi uguali)
       - lo spoglio non deve fare fuzzy matching su "Giulia"/"giulia "
       - il votante è un indice: l'insieme dei votanti e l'insieme dei
         partecipanti sono confrontabili, quindi gli assenti si ricavano
         per differenza invece che a occhio
  --------------------------------------------------------------- */
  function codice(){
    const parti = CONFIG.categorie.map(c =>
      voti[c.id].map(i => i.toString(36)).join("-"));
    return "VOTO" + CONFIG.versione + "|" + votanteIdx.toString(36) + "|" + parti.join("|");
  }

  // Parte leggibile: serve al votante per fidarsi di quello che invia
  // e a te per capire a occhio se un messaggio è arrivato monco.
  function messaggio(){
    const righe = [CONFIG.titolo, "Votante: " + CONFIG.partecipanti[votanteIdx], ""];
    CONFIG.categorie.forEach(c => {
      const nomi = voti[c.id].map(i => CONFIG.partecipanti[i]);
      righe.push(c.nome + ": " + (c.picks > 1
        ? nomi.map((n, k) => (k + 1) + ") " + n).join("  ")
        : nomi[0]));
    });
    righe.push("", "--- non cancellare la riga qui sotto ---", codice());
    return righe.join("\n");
  }

  /* ---------------------------------------------------------------
     INVIO
     Canale unico: POST all'endpoint. Niente ripieghi manuali.
     Senza un piano B il costo di un errore sale, quindi la gestione
     dell'errore deve diventare più seria, non più semplice:
       - ritenta da sola due volte prima di dare buca al votante
       - distingue "internet assente" da "server che risponde male",
         perché al votante servono due azioni diverse
       - lascia SEMPRE il pulsante riattivabile: un voto perso qui non
         si recupera in nessun altro modo.
  --------------------------------------------------------------- */
  const esito = document.getElementById("esito");

  function mostra(tipo, testo){
    esito.hidden = false;
    esito.className = "esito " + tipo;
    esito.textContent = testo;
  }

  async function inviaHttp(){
    const r = await fetch(CONFIG.endpoint, {
      method: "POST",
      // "text/plain" è un content-type CORS-safelisted: il browser manda la
      // richiesta diretta, senza preflight OPTIONS. Serve perché Apps Script
      // non risponde alle OPTIONS: con "application/json" il browser
      // bloccherebbe tutto PRIMA di inviare, e vedresti un errore CORS
      // opaco che sembra un problema di rete ma non lo è.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        votante: CONFIG.partecipanti[votanteIdx],
        codice: codice(),
        testo: messaggio()
      })
    });
    if (!r.ok) throw new Error("il server ha risposto " + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error(d.err || "voto rifiutato dal server");
  }

  const attesa = ms => new Promise(r => setTimeout(r, ms));

  btnInvia.addEventListener("click", async () => {
    btnInvia.disabled = true;
    esito.hidden = true;

    // Tre tentativi con pausa crescente. In una casa piena di gente il 4G
    // va a singhiozzo: un errore di rete è quasi sempre transitorio, e
    // ritentare da soli evita di scaricare sul votante un problema che si
    // risolve in due secondi. La pausa cresce per non martellare il server
    // se invece il problema è suo.
    for (let tentativo = 1; tentativo <= 3; tentativo++) {
      btnInvia.textContent = tentativo === 1 ? "Invio in corso" : "Nuovo tentativo " + tentativo;
      try {
        await inviaHttp();
        btnInvia.textContent = "Voto registrato";
        mostra("ok", "Voto registrato. Puoi chiudere la pagina.");
        // Promemoria locale, non un lucchetto: serve solo a evitare il
        // doppio invio per distrazione. Chi vuole rivotare può farlo e lo
        // spoglio tiene l'ultimo voto.
        try { localStorage.setItem("voto_inviato", new Date().toISOString()); } catch(e){}
        return;
      } catch (err) {
        if (tentativo === 3) {
          btnInvia.disabled = false;
          btnInvia.textContent = "Riprova";
          // TypeError da fetch() = la richiesta non è mai partita (rete
          // assente o DNS). Qualsiasi altro errore = il server ha risposto,
          // ma male. Sono due problemi diversi e due azioni diverse.
          mostra("ko", err instanceof TypeError
            ? "Connessione assente. Controlla la rete e premi Riprova."
            : "Invio non riuscito: " + err.message + ". Premi Riprova fra qualche secondo.");
        } else {
          await attesa(tentativo * 1500);
        }
      }
    }
  });

  CONFIG.categorie.forEach(c => c._render());
  aggiornaBarra();

  // Guardia di configurazione. Ora che non esiste un canale alternativo,
  // pubblicare la scheda con l'endpoint vuoto significherebbe raccogliere
  // zero voti senza che nessuno se ne accorga fino a spoglio fallito.
  // Meglio un blocco evidente e immediato che un silenzio credibile.
  if (!CONFIG.endpoint) {
    btnInvia.disabled = true;
    btnInvia.textContent = "Non configurata";
    mostra("ko", "Questa scheda non ha un endpoint configurato: i voti non "
                 + "verrebbero registrati. Avvisa l'organizzatore.");
    return;
  }

  // localStorage può lanciare in modalità privata su iOS: mai senza try.
  try {
    // Ripristino chi era: se ricarica la pagina per sbaglio non deve
    // ricercarsi nell'elenco. Le scelte no, quelle si rifanno: mezzo voto
    // ripristinato è peggio di nessun voto, perché sembra completo.
    const salvato = localStorage.getItem("votante_idx");
    if (salvato !== null && +salvato >= 0 && +salvato < CONFIG.partecipanti.length) {
      selNome.value = salvato;
      selNome.dispatchEvent(new Event("change"));
    }
    if (localStorage.getItem("voto_inviato")) {
      mostra("", "Da questo telefono risulta già inviato un voto. Se rivoti, vale l'ultimo.");
    }
  } catch(e){}
})();
</script>
</body>
</html>
